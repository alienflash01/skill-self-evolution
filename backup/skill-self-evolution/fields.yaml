# 字段定义：AI agent skill 自进化研究
# 字段框架融合系统综述（A Survey of Self-Evolving Agents, arXiv:2507.21046）
# 的 What/When/How/Where 分类法
# detail_level: brief(概要) -> moderate(中等) -> detailed(详尽)

field_categories:
  # 1. 基础信息
  - category: 基础信息
    fields:
      - name: name
        description: 方法/项目名称
        detail_level: brief
      - name: institution
        description: 提出机构/团队
        detail_level: brief
      - name: release_date
        description: 发布时间（论文发表或项目发布）
        detail_level: brief
      - name: paper_link
        description: 论文/arXiv 链接
        detail_level: brief
      - name: code_link
        description: 代码/项目仓库链接（若有）
        detail_level: brief
      - name: type
        description: 类型：academic(学术论文) / industry(工业产品/开源框架)
        detail_level: brief

  # 2. 进化对象 (What to evolve) —— 进化的载体
  - category: 进化对象_What
    description: 自进化的载体落在何处（参考综述 §3 四支柱）
    fields:
      - name: what_evolved
        description: 进化对象。取值：Model权重 / Context记忆与提示 / Tools技能 / Architecture(单/多智能体)
        detail_level: moderate
      - name: skill_as_artifact
        description: 技能是否作为独立可复用制品存在（是/否，及其形态）
        detail_level: moderate

  # 3. 技能表示 (Skill Representation)
  - category: 技能表示
    description: skill 如何被编码与组织
    fields:
      - name: skill_encoding
        description: 编码方式：可执行代码 / 自然语言 / API / 向量嵌入 / 图谱 / 技能文档(.md, 如SKILL.md)
        detail_level: moderate
      - name: skill_granularity
        description: 粒度：原子动作 / 子任务workflow / 策略规则 / 见解(insight)
        detail_level: moderate

  # 4. 自进化机制 (How to evolve) —— 方法范式
  - category: 自进化机制_How
    description: 用什么范式实现自进化（参考综述 §5）
    fields:
      - name: how_method
        description: >
          方法范式：reward-based(文本反馈/内部/外部/隐式奖励) /
          imitation_demonstration(模仿演示) /
          population_evolutionary(群体进化/遗传) /
          rollout_optimization(非梯度, 如文本空间优化) /
          gradient(SFT) / RL
        detail_level: detailed
      - name: learning_signal_source
        description: 学习信号来源：环境奖励 / LLM-as-judge / 自我反思 / 成败轨迹
        detail_level: moderate
      - name: reward_granularity
        description: 奖励粒度：process(过程) / outcome(结果) / hybrid(混合)
        detail_level: brief
      - name: learning_paradigm
        description: 范式轴：online vs offline；on-policy vs off-policy
        detail_level: brief

  # 5. 进化时机 (When to evolve)
  - category: 进化时机_When
    description: 何时触发进化（参考综述 §4）
    fields:
      - name: when_evolve
        description: 时机：intra-test-time(任务执行中在线) / inter-test-time(任务间离线或在线流式)
        detail_level: moderate
      - name: trigger
        description: 触发方式：事件触发 / 周期性 / 失败触发 / curriculum(课程)驱动
        detail_level: moderate

  # 6. 技能存储与检索 (Storage & Retrieval)
  - category: 存储与检索
    description: skill library 的结构与复用方式
    fields:
      - name: library_structure
        description: 库结构：扁平 / 层次化 / 向量库 / 技能文件 / 图谱
        detail_level: moderate
      - name: retrieval_method
        description: 检索/复用方式：语义相似度 / 代码直接复用 / 生成即检索(generation-as-retrieval) / 工作流匹配
        detail_level: moderate

  # 7. 验证与反馈 (Validation & Feedback)
  - category: 验证与反馈
    description: 如何保证技能质量与纠错
    fields:
      - name: validation
        description: 验证方式：执行验证(execution-based) / LLM-judge / 留出评估 / validation gating(门控)
        detail_level: moderate
      - name: error_correction
        description: 错误纠正：自我修订(self-revision) / 回滚 / 有界编辑(bounded edits)
        detail_level: moderate

  # 8. 环境与基座 (Environment & Backbone)
  - category: 环境与基座
    fields:
      - name: test_env
        description: 测试环境：Minecraft / Web / GUI / coding / tool-call / 通用
        detail_level: brief
      - name: backbone_model
        description: 底座模型：GPT-4 / Claude / 开源LLM / VLM
        detail_level: brief
      - name: where_deploy
        description: 部署域（参考综述 §6 Where）：general(通用) / specialized(coding/GUI/medical/education 等专用域)
        detail_level: brief

  # 9. 评估指标 (Evaluation Metrics)
  - category: 评估指标
    fields:
      - name: metrics
        description: 评估方法：success_rate(成功率) / generalization(新任务泛化) / sample_efficiency(样本效率) / skill_library_growth(技能库增长) / cost(成本)
        detail_level: moderate
      - name: key_results
        description: 关键实验结论/提升幅度
        detail_level: moderate

  # 10. 局限与挑战 (Limitations & Challenges)
  - category: 局限与挑战
    fields:
      - name: limitations
        description: 局限：scalability(可扩展性) / catastrophic_forgetting(灾难性遗忘) / transferability(迁移性) / eval-hacking(评估作弊) / controllability(可控制性)
        detail_level: moderate

# 不确定字段（深度调研阶段自动填充）
uncertain:
  - paper_link   # 部分工程项目可能无正式论文
  - key_results  # 需深入阅读论文获取
  - code_link    # 部分方法未开源
